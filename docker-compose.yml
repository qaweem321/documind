# Local development and self-hosting.
#   docker compose up -d db                    # Postgres + pgvector only, for local development
#   docker compose --profile app up -d --build # everything, at http://localhost:3600
#
# Put ANTHROPIC_API_KEY in a .env file next to this one; the backend refuses to start without it.
# The database password is for local use only.

services:
  db:
    image: pgvector/pgvector:0.8.6-pg17-bookworm
    environment:
      POSTGRES_USER: documind
      POSTGRES_PASSWORD: documind
      POSTGRES_DB: documind
    ports:
      - "5434:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U documind"]
      interval: 5s
      retries: 20

  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql://documind:documind@db:5432/documind
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      CORS_ORIGINS: '["http://localhost:3600"]'
      SEED_EXAMPLES: "true"
    depends_on:
      db: { condition: service_healthy }
    profiles: ["app"]

  frontend:
    build: ./frontend
    ports:
      - "3600:3600"
    depends_on:
      backend: { condition: service_healthy }
    profiles: ["app"]

volumes:
  pgdata:
