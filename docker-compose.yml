# Local development and self-hosting.
#   docker compose up -d db                    # Postgres + pgvector only, for local development
#   docker compose --profile app up -d --build # everything, at http://localhost:3600
#
# Put ANTHROPIC_API_KEY in a .env file next to this one for real answers; without it DocuMind
# runs in demo mode. The database password is for local use only.

services:
  db:
    image: pgvector/pgvector:0.8.6-pg17-bookworm
    environment:
      POSTGRES_USER: documind
      POSTGRES_PASSWORD: documind
      POSTGRES_DB: documind
    ports:
      - "5434:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U documind"]
      interval: 5s
      retries: 20

  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql://documind:documind@db:5432/documind
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      CORS_ORIGINS: '["http://localhost:3600"]'
      SEED_EXAMPLES: "true"
      # Every request arrives through the frontend's proxy. Trusting its X-Forwarded-For header
      # (only from this network) gives the rate limit each visitor's own address.
      FORWARDED_ALLOW_IPS: 172.30.236.0/24
    depends_on:
      db: { condition: service_healthy }
    profiles: ["app"]

  frontend:
    build: ./frontend
    ports:
      - "3600:3600"
    depends_on:
      backend: { condition: service_healthy }
    profiles: ["app"]

# A fixed subnet, so FORWARDED_ALLOW_IPS above can name it.
networks:
  default:
    ipam:
      config:
        - subnet: 172.30.236.0/24

volumes:
  pgdata:
